<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunex Games — Coming Soon</title>
<meta name="description" content="Lunex Games is a game development studio. Our first worlds are on the rise — coming soon.">
<meta name="theme-color" content="#05060f">
<meta property="og:title" content="Lunex Games — Coming Soon">
<meta property="og:description" content="Our first worlds are on the rise.">
<meta property="og:type" content="website">

<style>
  :root {
    --ink: #f6ecd6;
    --ink-soft: rgba(233, 228, 222, .72);
    --ink-faint: rgba(233, 228, 222, .46);
    --line: rgba(246, 236, 214, .16);
    --glow: rgba(246, 226, 180, .34);
    --night: #05060f;
    --display: "Unbounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(110% 85% at 50% 30%, #0f1330 0%, #080a1e 45%, var(--night) 80%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--body);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .page {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4.5vh, 48px);
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .moon-slot {
    flex: none;
    width: min(44vh, 62vw, 460px);
    aspect-ratio: 1;
    margin-top: clamp(16px, 5vh, 56px);
  }
  .copy { will-change: transform; }

  h1 {
    margin: 0;
    font: 300 clamp(1.7rem, 5.6vw, 3.5rem)/1.1 var(--display);
    letter-spacing: .2em;
    margin-right: -.2em;
    text-transform: uppercase;
    text-shadow: 0 0 38px var(--glow);
  }
  .soon {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.1em;
    margin: clamp(12px, 2vh, 20px) 0 0;
    font: 400 clamp(.72rem, 1.7vw, .95rem)/1.4 var(--display);
    letter-spacing: .46em;
    text-transform: uppercase;
    color: transparent;
    background: linear-gradient(100deg, #b9a98a 30%, #fff8e6 50%, #b9a98a 70%) 0 0 / 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: sheen 5.5s ease-in-out infinite;
  }
  .soon::before, .soon::after {
    content: "";
    width: clamp(20px, 7vw, 72px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ink-faint));
  }
  .soon::after { transform: scaleX(-1); }
  .tagline {
    margin: clamp(10px, 1.8vh, 16px) 0 0;
    font-size: clamp(.92rem, 1.7vw, 1.05rem);
    color: var(--ink-soft);
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 720px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .links a {
    --mx: 0px;
    --my: 0px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 46px;
    padding: 0 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(14, 17, 42, .55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    color: var(--ink);
    font-size: .92rem;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transform: translate(var(--mx), var(--my));
    transition: transform .25s cubic-bezier(.2, .8, .2, 1), border-color .25s, background .25s, box-shadow .25s;
  }
  .links a:hover {
    border-color: rgba(246, 226, 180, .6);
    background: rgba(40, 40, 70, .6);
    box-shadow: 0 0 28px rgba(246, 226, 180, .2);
  }
  .links a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .links svg { width: 18px; height: 18px; flex: none; fill: currentColor; }

  /* Intro: the copy rises after the moon has faded in */
  .rise { opacity: 0; animation: rise 1.2s cubic-bezier(.2, .8, .2, 1) forwards; }
  h1.rise { animation-delay: .5s; }
  .soon-wrap.rise { animation-delay: .75s; }
  .links.rise { animation-delay: 1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }

  @media (max-width: 520px) {
    .links { display: grid; grid-template-columns: 1fr 1fr; width: 100%; max-width: 360px; }
    .links a { padding: 0 12px; }
    .soon { letter-spacing: .34em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; animation: none; }
    .soon { animation: none; background-position: 50% 0; }
    .links a { transition: none; }
  }
</style>

<body>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const sky = document.getElementById('sky');
  const ctx = sky.getContext('2d');
  const slot = document.getElementById('moonSlot');
  const copy = document.getElementById('copy');

  let W = 0, H = 0, DPR = 1;
  const moon = { x: 0, y: 0, r: 100 };

  /* ---------- Moon: baked surface + per-frame lighting in WebGL ---------- */

  const VERT = 'attribute vec2 a;varying vec2 v;void main(){v=a;gl_Position=vec4(a,0.,1.);}';

  // Renders once into a texture: rgb = surface normal, a = albedo.
  const BAKE_FRAG = `
    precision highp float;
    varying vec2 v;
    const float PI = 3.14159265;

    vec3 hash(vec3 p) {
      p = fract(p * vec3(.1031, .1030, .0973));
      p += dot(p, p.yxz + 33.33);
      return fract((p.xxy + p.yxx) * p.zyx);
    }
    float noise(vec3 p) {
      vec3 i = floor(p), f = fract(p);
      f = f * f * (3. - 2. * f);
      return mix(
        mix(mix(hash(i).x, hash(i + vec3(1,0,0)).x, f.x), mix(hash(i + vec3(0,1,0)).x, hash(i + vec3(1,1,0)).x, f.x), f.y),
        mix(mix(hash(i + vec3(0,0,1)).x, hash(i + vec3(1,0,1)).x, f.x), mix(hash(i + vec3(0,1,1)).x, hash(i + vec3(1,1,1)).x, f.x), f.y),
        f.z);
    }
    float fbm(vec3 p) {
      float s = 0., a = .5;
      for (int i = 0; i < 4; i++) { s += a * noise(p); p = p * 2.03 + 7.1; a *= .5; }
      return s;
    }
    float craters(vec3 p, float scale, float seed) {
      vec3 q = p * scale + seed;
      vec3 b = floor(q - .5);
      float h = 0.;
      for (int x = 0; x < 2; x++) for (int y = 0; y < 2; y++) for (int z = 0; z < 2; z++) {
        vec3 c = b + vec3(float(x), float(y), float(z));
        vec3 r = hash(c + seed);
        if (r.x < .42) continue;
        float rad = .1 + .2 * r.y * r.y;
        vec3 centre = c + .5 + (hash(c + seed + 9.) - .5) * .2;
        float d = length(q - centre) / rad;
        if (d > 1.3) continue;
        float depth = .34 * rad / scale;
        float bowl = -depth * smoothstep(1., .55, d);
        float rim = depth * .38 * exp(-pow((d - 1.) / .16, 2.)) * smoothstep(1.3, 1.14, d);
        h += bowl + rim;
      }
      return h;
    }
    float height(vec3 p, float mare) {
      float c = craters(p, 3.6, 11.) + craters(p.zxy, 8.5, 37.) + craters(p.yzx, 19., 71.) + craters(p, 37., 113.);
      return c * (1. - .55 * mare) + fbm(p * 7.) * .012 + noise(p * 46.) * .0018;
    }
    float rays(vec3 p, vec3 c, float reach) {
      float a = acos(clamp(dot(p, c), -1., 1.));
      float bearing = noise(normalize(cross(p, c) + 1e-5) * 15.);
      return smoothstep(reach, 0., a) * pow(bearing, 3.) * 2.4 + smoothstep(.05, .02, a) * .4;
    }
    void main() {
      vec2 uv = v * .5 + .5;
      float lon = (uv.x - .5) * 2. * PI, lat = (uv.y - .5) * PI;
      vec3 p = vec3(cos(lat) * cos(lon), sin(lat), cos(lat) * sin(lon));

      float mare = smoothstep(.47, .58, fbm(p * 1.55 + 3.1));
      const float e = .002;
      float h0 = height(p, mare);
      vec3 g = vec3(height(p + vec3(e,0,0), mare), height(p + vec3(0,e,0), mare), height(p + vec3(0,0,e), mare)) - h0;
      g /= e;
      vec3 n = normalize(p - (g - dot(g, p) * p) * .85);

      float albedo = mix(.86, .4, mare) + (fbm(p * 13.) - .47) * .3;
      albedo += clamp(-h0 * 7., 0., .05);
      albedo += .3 * rays(p, normalize(vec3(.62, -.5, .6)), .75);
      albedo += .2 * rays(p, normalize(vec3(-.5, .55, -.65)), .6);
      albedo += .16 * rays(p, normalize(vec3(-.75, .1, .65)), .4);

      gl_FragColor = vec4(n * .5 + .5, clamp(albedo, 0., 1.));
    }`;

  const MOON_FRAG = `
    precision highp float;
    varying vec2 v;
    uniform sampler2D T;
    uniform mat3 uR;
    uniform vec3 uL;
    uniform float uBright, uAA;
    const float TAU = 6.2831853, PI = 3.1415927;
    void main() {
      vec2 c = v * (1. + uAA);
      float r = length(c);
      float edge = 1. - smoothstep(1. - uAA, 1., r);
      if (edge <= 0.) { gl_FragColor = vec4(0.); return; }
      vec3 N = vec3(c, sqrt(max(0., 1. - r * r)));
      vec3 O = uR * N;
      vec4 s = texture2D(T, vec2(atan(O.z, O.x) / TAU + .5, asin(clamp(O.y, -1., 1.)) / PI + .5));
      vec3 n = normalize((s.xyz * 2. - 1.) * uR);

      // Lambert blended with Lommel-Seeger: regolith lights up evenly right to the limb
      float mu0 = max(dot(n, uL), 0.);
      float regolith = min(2. * mu0 / (mu0 + max(N.z, .05)), 1.15);
      float lit = mix(pow(mu0, .82), regolith, .55) * smoothstep(-.08, .22, dot(N, uL));
      lit *= 1. - .38 * lit;  // keep a full moon from blowing out
      vec3 col = vec3(1., .94, .82) * s.a * lit * 2.5;
      col += vec3(.2, .27, .46) * s.a * (.075 + .05 * N.z);                // earthshine
      col += vec3(.66, .78, 1.) * pow(1. - N.z, 3.) * (.07 + .28 * lit);   // limb haze
      col *= uBright;
      col = 1. - exp(-col * 1.5);
      gl_FragColor = vec4(col * edge, edge);
    }`;

  function createMoonRenderer() {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
    if (!gl) return null;

    const program = (frag) => {
      const p = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, frag]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        gl.attachShader(p, s);
      }
      gl.bindAttribLocation(p, 0, 'a');
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      return p;
    };

    let bake, shade;
    try {
      bake = program(BAKE_FRAG);
      shade = program(MOON_FRAG);
    } catch (err) {
      console.warn('Moon shader unavailable, using 2D fallback:', err);
      return null;
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

    // Bake the surface in strips so slower GPUs never stall on one huge draw
    const size = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), innerWidth < 700 ? 1024 : 2048);
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size / 2, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.viewport(0, 0, size, size / 2);
    gl.useProgram(bake);
    gl.enable(gl.SCISSOR_TEST);
    const strip = size / 32;
    for (let i = 0; i < 16; i++) {
      gl.scissor(0, i * strip, size, strip);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.flush();
    }
    gl.disable(gl.SCISSOR_TEST);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.useProgram(shade);
    const u = {
      R: gl.getUniformLocation(shade, 'uR'),
      L: gl.getUniformLocation(shade, 'uL'),
      bright: gl.getUniformLocation(shade, 'uBright'),
      aa: gl.getUniformLocation(shade, 'uAA'),
    };

    return {
      canvas,
      lost: false,
      resize(px) {
        canvas.width = canvas.height = px;
        gl.viewport(0, 0, px, px);
        gl.uniform1f(u.aa, 2.5 / px);
      },
      render(light, spin, tiltX, tiltZ, bright) {
        const cy = Math.cos(spin), sy = Math.sin(spin);
        const cx = Math.cos(tiltX), sx = Math.sin(tiltX);
        const cz = Math.cos(tiltZ), sz = Math.sin(tiltZ);
        // R = Ry(spin) * Rx(tiltX) * Rz(tiltZ), column-major
        const r00 = cy * cz + sy * sx * sz, r01 = -cy * sz + sy * sx * cz, r02 = sy * cx;
        const r10 = cx * sz, r11 = cx * cz, r12 = -sx;
        const r20 = -sy * cz + cy * sx * sz, r21 = sy * sz + cy * sx * cz, r22 = cy * cx;
        gl.uniformMatrix3fv(u.R, false, [r00, r10, r20, r01, r11, r21, r02, r12, r22]);
        gl.uniform3fv(u.L, light);
        gl.uniform1f(u.bright, bright);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      },
    };
  }

  const renderer = createMoonRenderer();
  if (renderer) {
    renderer.canvas.addEventListener('webglcontextlost', () => { renderer.lost = true; });
  }

  function drawFallbackMoon(light, bright) {
    const { x, y, r } = moon;
    const g = ctx.createRadialGradient(x + light[0] * r * .7, y - light[1] * r * .7, r * .1, x, y, r * 1.5);
    g.addColorStop(0, `rgba(255, 246, 224, ${bright})`);
    g.addColorStop(.55, `rgba(190, 180, 165, ${bright})`);
    g.addColorStop(1, '#141830');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }

  /* ---------- Sprites ---------- */

  function glowSprite(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [at, col] of stops) grad.addColorStop(at, col);
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }
  function sparkleSprite(size, rgb) {
    const c = glowSprite(size, [[0, `rgba(${rgb},.9)`], [.14, `rgba(${rgb},.3)`], [.42, `rgba(${rgb},0)`]]);
    const g = c.getContext('2d');
    const mid = size / 2;
    g.globalCompositeOperation = 'lighter';
    g.translate(mid, mid);
    for (let i = 0; i < 2; i++) {
      const len = i ? mid : mid * .94;
      g.rotate(i * Math.PI / 2);
      const beam = g.createLinearGradient(-len, 0, len, 0);
      beam.addColorStop(0, `rgba(${rgb},0)`);
      beam.addColorStop(.5, `rgba(${rgb},1)`);
      beam.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = beam;
      g.beginPath();
      g.moveTo(-len, 0);
      g.quadraticCurveTo(0, -size * .022, len, 0);
      g.quadraticCurveTo(0, size * .022, -len, 0);
      g.fill();
    }
    return c;
  }

  const TINTS = ['255,250,240', '198,216,255', '255,226,186'];
  const dots = TINTS.map((rgb) => glowSprite(32, [[0, `rgba(${rgb},1)`], [.22, `rgba(${rgb},.75)`], [.5, `rgba(${rgb},.12)`], [1, `rgba(${rgb},0)`]]));
  const sparkles = TINTS.map((rgb) => sparkleSprite(96, rgb));
  const moonGlow = glowSprite(512, [
    [0, 'rgba(255,236,196,.7)'], [.44, 'rgba(255,232,186,.62)'], [.52, 'rgba(244,214,180,.3)'],
    [.72, 'rgba(150,140,220,.1)'], [1, 'rgba(90,100,220,0)'],
  ]);
  const cursorGlow = glowSprite(256, [[0, 'rgba(255,236,196,.2)'], [.35, 'rgba(180,190,255,.06)'], [1, 'rgba(160,170,255,0)']]);
  const nebulae = [
    { sprite: glowSprite(512, [[0, 'rgba(72,56,170,.17)'], [.55, 'rgba(54,46,140,.05)'], [1, 'rgba(50,40,140,0)']]), x: .16, y: .24, s: 1.05, depth: 16 },
    { sprite: glowSprite(512, [[0, 'rgba(26,100,150,.13)'], [.55, 'rgba(20,72,130,.04)'], [1, 'rgba(20,70,130,0)']]), x: .86, y: .68, s: 1.15, depth: 24 },
    { sprite: glowSprite(512, [[0, 'rgba(140,60,125,.08)'], [1, 'rgba(120,50,120,0)']]), x: .72, y: .08, s: .8, depth: 10 },
  ];

  /* ---------- Scene state ---------- */

  let stars = [], orbiters = [];
  const sparks = [], shooters = [];

  function makeStars() {
    const count = clamp(Math.round(W * H / 2600), 160, 620);
    stars = Array.from({ length: count }, () => {
      const depth = Math.pow(Math.random(), 2.2);
      return {
        x: rand(-60, W + 60), y: rand(-60, H + 60),
        depth,
        size: .5 + depth * 1.9 + (Math.random() < .03 ? 1 : 0),
        base: .3 + depth * .65,
        tint: Math.random() < .68 ? 0 : (Math.random() < .6 ? 1 : 2),
        speed: rand(.4, 2.4), phase: rand(TAU),
        sparkle: depth > .72 && Math.random() < .5,
        ox: 0, oy: 0,
      };
    });
  }

  function makeOrbiters() {
    const rings = [
      { count: 26, a: [1.3, 1.5], squash: .3, tilt: -.38, speed: .22 },
      { count: 20, a: [1.6, 1.95], squash: .38, tilt: .24, speed: -.14 },
      { count: 14, a: [2.05, 2.5], squash: .24, tilt: -.1, speed: .08 },
    ];
    orbiters = rings.flatMap((ring) => Array.from({ length: ring.count }, () => ({
      ring,
      a: rand(ring.a[0], ring.a[1]),
      angle: rand(TAU),
      speed: ring.speed * rand(.8, 1.2),
      size: rand(.8, 2.2),
      tint: Math.floor(rand(TINTS.length)),
      phase: rand(TAU),
      sparkle: Math.random() < .28,
    })));
  }

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    sky.width = Math.round(W * DPR);
    sky.height = Math.round(H * DPR);
    const rect = slot.getBoundingClientRect();
    moon.x = rect.left + rect.width / 2;
    moon.y = rect.top + rect.height / 2;
    moon.r = rect.width / 2;
    if (renderer) renderer.resize(Math.round(rect.width * DPR));
    makeStars();
    if (!orbiters.length) makeOrbiters();
  }

  /* ---------- Pointer ---------- */

  const pointer = { x: 0, y: 0, active: false, last: -10 };
  const eased = { x: 0, y: 0, nx: 0, ny: 0, speed: 0 };
  const lightDir = [-.5, .55, .67];

  addEventListener('pointermove', (e) => {
    if (!pointer.active) { eased.x = e.clientX; eased.y = e.clientY; }
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.active = true;
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { pointer.active = false; });
  addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') pointer.active = false; });
  addEventListener('pointerdown', (e) => {
    if (motion) burst(e.clientX, e.clientY, 34);
  }, { passive: true });

  // Store and social buttons lean towards the cursor
  if (motion && matchMedia('(hover: hover)').matches) {
    for (const a of document.querySelectorAll('#links a')) {
      a.addEventListener('pointermove', (e) => {
        const r = a.getBoundingClientRect();
        a.style.setProperty('--mx', `${(e.clientX - r.left - r.width / 2) * .18}px`);
        a.style.setProperty('--my', `${(e.clientY - r.top - r.height / 2) * .28}px`);
      });
      a.addEventListener('pointerleave', () => {
        a.style.setProperty('--mx', '0px');
        a.style.setProperty('--my', '0px');
      });
    }
  }

  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), v = rand(30, 240);
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: rand(.5, 1.2), size: rand(1, 2.6), tint: Math.floor(rand(TINTS.length)) });
    }
  }

  /* ---------- Moon blink: slow breathing, plus a soft double flicker every few seconds ---------- */

  let nextBlink = 3.2, blinkAt = -10;
  function moonPulse(t) {
    if (!motion) return { bright: 1, glow: .85 };
    if (t > nextBlink) { blinkAt = t; nextBlink = t + rand(4.5, 9); }
    const k = t - blinkAt;
    const dip = .62 * Math.exp(-Math.pow((k - .14) / .06, 2)) + .42 * Math.exp(-Math.pow((k - .42) / .08, 2));
    const flare = .22 * Math.exp(-Math.pow((k - .72) / .22, 2));
    const breathe = .5 + .5 * Math.sin(t * 1.15) * Math.cos(t * .37);
    return { bright: .95 + .1 * breathe - dip + flare, glow: Math.max(.08, .68 + .32 * breathe - dip * .9 + flare * 1.3) };
  }

  /* ---------- Frame ---------- */

  function sprite(img, x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
  }

  function drawStars(t, dt) {
    const near = [];
    const cx = eased.x, cy = eased.y;
    for (const s of stars) {
      const px = s.x - eased.nx * (6 + s.depth * 44);
      const py = s.y - eased.ny * (6 + s.depth * 44);
      // Stars drift away from the cursor and spring back when it leaves
      let tx = 0, ty = 0;
      if (pointer.active) {
        const dx = px - cx, dy = py - cy, d = Math.hypot(dx, dy) || 1;
        if (d < 170) {
          const push = Math.pow(1 - d / 170, 2) * (14 + s.depth * 26);
          tx = dx / d * push;
          ty = dy / d * push;
          if (s.depth > .16 && near.length < 34) near.push({ x: px + s.ox, y: py + s.oy, d });
        }
      }
      s.ox += (tx - s.ox) * Math.min(1, dt * 5);
      s.oy += (ty - s.oy) * Math.min(1, dt * 5);

      const tw = motion ? .58 + .42 * Math.sin(t * s.speed + s.phase) : .8;
      const alpha = s.base * tw;
      const x = px + s.ox, y = py + s.oy;
      if (s.sparkle) sprite(sparkles[s.tint], x, y, (10 + s.size * 7) * (.6 + tw * .5), alpha);
      sprite(dots[s.tint], x, y, s.size * 4.2, alpha);
    }

    // Nearby stars join into a constellation around the cursor
    ctx.globalAlpha = 1;
    ctx.lineWidth = .7;
    for (let i = 0; i < near.length; i++) {
      const a = near[i];
      const links = [];
      for (let j = i + 1; j < near.length; j++) {
        const b = near[j];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d < 120) links.push({ b, d });
      }
      links.sort((m, n) => m.d - n.d);
      for (const { b, d } of links.slice(0, 2)) {
        const alpha = (1 - d / 120) * (1 - Math.max(a.d, b.d) / 170) * .85;
        ctx.strokeStyle = `rgba(226,224,255,${alpha})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  }

  function drawOrbiters(t, dt, front, mx, my) {
    const excited = pointer.active ? clamp(1 - (Math.hypot(eased.x - mx, eased.y - my) - moon.r) / (moon.r * 2), 0, 1) : 0;
    for (const o of orbiters) {
      if (front) o.angle += o.speed * dt * (1 + excited * 2.6);
      const depth = Math.sin(o.angle);
      if ((depth > 0) !== front) continue;
      const rx = Math.cos(o.angle) * o.a * moon.r;
      const ry = depth * o.a * moon.r * o.ring.squash;
      const tilt = o.ring.tilt + eased.nx * .1;
      const x = mx + rx * Math.cos(tilt) - ry * Math.sin(tilt);
      const y = my + rx * Math.sin(tilt) + ry * Math.cos(tilt) + eased.ny * 8;
      const scale = .72 + .4 * depth;
      const tw = motion ? .62 + .38 * Math.sin(t * 2.2 + o.phase) : .85;
      const alpha = (.42 + .5 * (depth * .5 + .5)) * tw;
      if (o.sparkle) sprite(sparkles[o.tint], x, y, (15 + o.size * 8) * scale * (.65 + tw * .5), alpha);
      sprite(dots[o.tint], x, y, o.size * 4 * scale, alpha);
    }
  }

  function drawShooters(t, dt) {
    if (motion && t > nextShooter) {
      nextShooter = t + rand(3.5, 9);
      const fromLeft = Math.random() < .5;
      const a = fromLeft ? rand(.2, .55) : Math.PI - rand(.2, .55);
      const v = rand(620, 980);
      shooters.push({
        x: fromLeft ? rand(-.05, .5) * W : rand(.5, 1.05) * W,
        y: rand(-.05, .35) * H,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1, len: rand(110, 220),
      });
    }
    ctx.globalAlpha = 1;
    ctx.lineCap = 'round';
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.life -= dt * 1.15;
      if (s.life <= 0) { shooters.splice(i, 1); continue; }
      const speed = Math.hypot(s.vx, s.vy);
      const tx = s.x - s.vx / speed * s.len, ty = s.y - s.vy / speed * s.len;
      const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      const head = Math.min(1, s.life * 1.6);
      g.addColorStop(0, `rgba(255,250,235,${head})`);
      g.addColorStop(1, 'rgba(190,205,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      sprite(dots[0], s.x, s.y, 10, head);
    }
  }

  function drawSparks(dt) {
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= 1 - dt * 1.8;
      s.vy *= 1 - dt * 1.8;
      s.life -= s.decay * dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      sprite(dots[s.tint], s.x, s.y, s.size * 4.5, s.life);
    }
  }

  let last = 0, spin = 2.4, nextShooter = 2, startedAt = null;
  const prev = { x: 0, y: 0 };

  function frame(ms) {
    if (startedAt === null) startedAt = ms;
    const t = (ms - startedAt) / 1000;
    const dt = Math.min((ms - last) / 1000 || 0, .05);
    last = ms;

    // Without a pointer (touch, idle) the light circles on its own
    const idleX = moon.x + Math.cos(t * .22) * moon.r * 1.7 - moon.r * .4;
    const idleY = moon.y + Math.sin(t * .22) * moon.r * .9 - moon.r * .7;
    const useCursor = motion && pointer.active;
    const goalX = useCursor ? pointer.x : (motion ? idleX : moon.x - moon.r);
    const goalY = useCursor ? pointer.y : (motion ? idleY : moon.y - moon.r);
    const ease = motion ? Math.min(1, dt * (useCursor ? 5 : 1.4)) : 1;
    eased.x += (goalX - eased.x) * ease;
    eased.y += (goalY - eased.y) * ease;
    eased.nx += ((useCursor ? pointer.x / W * 2 - 1 : 0) - eased.nx) * Math.min(1, dt * 2.6 || 0);
    eased.ny += ((useCursor ? pointer.y / H * 2 - 1 : 0) - eased.ny) * Math.min(1, dt * 2.6 || 0);

    // Fast cursor sweeps shed a little stardust
    if (useCursor && sparks.length < 220) {
      const moved = Math.hypot(pointer.x - prev.x, pointer.y - prev.y);
      if (moved > 14 && moved < 400 && Math.random() < .7) {
        const a = rand(TAU);
        sparks.push({ x: pointer.x, y: pointer.y, vx: Math.cos(a) * 26, vy: Math.sin(a) * 26 + 16, life: 1, decay: rand(1, 1.8), size: rand(.7, 1.7), tint: Math.floor(rand(TINTS.length)) });
      }
    }
    prev.x = pointer.x;
    prev.y = pointer.y;

    // The light follows the cursor, so the moon's phase changes as it moves
    const lx = (eased.x - moon.x) / (moon.r * 2.4);
    const ly = -(eased.y - moon.y) / (moon.r * 2.4);
    const lz = .42;
    const ll = Math.hypot(lx, ly, lz);
    lightDir[0] = lx / ll;
    lightDir[1] = ly / ll;
    lightDir[2] = lz / ll;

    const mx = moon.x + eased.nx * 14;
    const my = moon.y + eased.ny * 10;
    const reveal = motion ? clamp(t / 1.6, 0, 1) : 1;
    const revealEase = 1 - Math.pow(1 - reveal, 3);
    const pulse = moonPulse(t);
    if (motion) spin += dt * .03;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    const unit = Math.max(W, H);
    for (const n of nebulae) {
      const size = unit * n.s;
      sprite(n.sprite, n.x * W - eased.nx * n.depth, n.y * H - eased.ny * n.depth, size, 1);
    }
    drawStars(t, dt);
    drawShooters(t, dt);
    drawOrbiters(t, dt, false, mx, my);

    const near = pointer.active ? clamp(1 - Math.hypot(eased.x - mx, eased.y - my) / (moon.r * 2.4), 0, 1) : 0;
    sprite(moonGlow, mx, my, moon.r * 4.4 * (1 + near * .07), pulse.glow * revealEase * (.82 + near * .18));

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = revealEase;
    if (renderer && !renderer.lost) {
      renderer.render(lightDir, spin, -.1 + eased.ny * .16, .12 - eased.nx * .1, pulse.bright * revealEase);
      ctx.drawImage(renderer.canvas, mx - moon.r, my - moon.r, moon.r * 2, moon.r * 2);
    } else {
      drawFallbackMoon(lightDir, clamp(pulse.bright, .3, 1));
    }

    ctx.globalCompositeOperation = 'lighter';
    drawOrbiters(t, dt, true, mx, my);
    drawSparks(dt);
    if (pointer.active) sprite(cursorGlow, eased.x, eased.y, 320, .9);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    copy.style.transform = `translate(${eased.nx * -7}px, ${eased.ny * -5}px)`;

    if (motion) requestAnimationFrame(frame);
  }

  addEventListener('resize', () => {
    resize();
    if (!motion) frame(performance.now());
  });
  resize();
  eased.x = moon.x - moon.r * 2;
  eased.y = moon.y - moon.r * .9;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
